# Point 13: tagging a version produces something a person can download -
# a wheel and a source distribution, attached to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v1.2.3"
        required: true

permissions:
  contents: write

jobs:
  build:
    # One runner, not a matrix: the wheel is pure Python, so a second operating
    # system would produce a byte-identical file under the same name.
    name: Build the wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # Only the build backend is needed: the wheel is pure Python, and
      # installing torch here would cost gigabytes for no added confidence.
      - run: python -m pip install --upgrade pip build

      - name: Build artefact
        run: python scripts/build_release_artifact.py --version "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: build
    # A manual run has no tag, and GitHub Releases cannot be created
    # without one. Skipping keeps a trial run green instead of emailing a
    # failure that says nothing was wrong.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Collect files
        run: |
          mkdir -p release
          find artefacts -type f \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec cp {} release/ \;
          ls -la release
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
